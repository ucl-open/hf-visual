[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "open-rigs-hf-visual"
description = "A library that defines a open-rigs data schema for the hf-visual experiment."
authors = [ {name = "RoboDoig", email = "a.erskine@neurogears.org"}]
license = "MIT"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
  "pydantic-settings"
]

# [project.urls]
# Documentation = "https://open-rigs.github.io/Open.Rigs.HfVisual/"
# Repository = "https://github.com/OpenRigs/Open.Rigs.HfVisual/"
# Issues = "https://github.com/OpenRigs/Open.Rigs.HfVisual/issues"
# Changelog = "https://github.com/OpenRigs/Open.Rigs.HfVisual/releases"

[project.optional-dependencies]

data = ["contraqctor<0.5.0"]

[dependency-groups]

dev = [
    "open-rigs-hf-visual[data]",
    "ruff",
    "codespell"
]

[project.scripts]
hf-visual = "open_rigs_hf_visual.cli:main"
regenerate-schemas = "open_rigs_hf_visual.regenerate:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
default-groups = ['dev']
required-version = '>=0.8.4'

[tool.uv.sources]
open-rigs = {git = "https://github.com/open-rigs/open-rigs", branch = "aeon-api"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }
